<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src blob: mediastream:; img-src 'self' data:;">
<link rel="icon" type="image/svg+xml" href="mmagnifier-logo.svg">
<title>mmagnifier \ High contrast magnifying glass and binoculars for your phone. Easily zoom to see labels, distant objects, and fine detail.</title>
<meta name="description" content="Turn your phone into a powerful handheld magnifying glass for easy reading. Zoom text, labels, and fine detail. Switch between high-contrast color modes. Simple, large controls. Easy to use. Good for people with low vision or dyslexia.">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --serif: 'Times New Roman', Times, Georgia, serif;
    --btn-bar-height: 72px;
    --controls-height: var(--btn-bar-height);
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border-width: 0;
  }

  .heading {
    z-index: 1000;
    position: fixed;
    top: 0.7rem;
    left: 0.75rem;
    line-height: 0;
    margin: 0;
  }

  .logo-icon {
    width: 36px;
    height: auto;
    display: block;
  }

  #zoom-pill {
    position: fixed;
    top: 0.7rem;
    right: 0.75rem;
    z-index: 1000;
    background: #000;
    border: 1.5px solid #fff;
    border-radius: 999px;
    padding: 5px 14px;
    color: #fff;
    font-family: var(--serif);
    font-size: 16px;
    font-weight: bold;
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* ── Viewfinder ── */
  #viewfinder {
    position: fixed;
    inset: 0;
    bottom: var(--controls-height);
    overflow: hidden;
    background: #000;
    isolation: isolate;
    touch-action: none;
  }

  video, #camera-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform-origin: center center;
    display: block;
    background: #000;
  }

  /* Hide the video element until the camera stream is attached.
     opacity:0 keeps autoplay/srcObject working; the play-button overlay
     never renders because it has nothing to paint over. */
  #camera { opacity: 0; }

  /* Suppress any remaining WebView media-control chrome, just in case */
  video::-webkit-media-controls,
  video::-webkit-media-controls-enclosure,
  video::-webkit-media-controls-overlay-play-button,
  video::-internal-media-controls-overlay-cast-button { display: none !important; }

  #camera-canvas { display: none; }
  #viewfinder.canvas-tier #camera-canvas { display: block; }

  #tint-overlay {
    position: absolute;
    inset: 0;
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  #no-camera {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    color: #fff;
    background: #000;
    font-family: var(--serif);
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    padding: 2rem;
    line-height: 1.5;
    cursor: pointer;
    z-index: 5;
  }
  #no-camera:active { background: #181818; }

  /* ── Controls ── */
  #controls {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: var(--controls-height);
    z-index: 20;
  }

  #btn-bar {
    height: var(--btn-bar-height);
    display: flex;
    background: #000;
    border-top: 2px solid #fff;
  }

  .btn {
    flex: 1;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: none;
    border-left: 2px solid #fff;
    background: #000;
    cursor: pointer;
    padding: 10px 12px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: background 0.07s;
    overflow: hidden;
  }

  .btn:first-child { border-left: none; }
  .btn:active     { background: #181818; }

  .btn svg {
    width: 38px;
    height: 38px;
    display: block;
    flex-shrink: 0;
  }

  .btn-label {
    color: #fff;
    font-family: var(--serif);
    font-size: 15px;
    font-weight: bold;
    line-height: 1;
    text-align: left;
    white-space: nowrap;
  }

  /* Compact mode — used when the bar has 4 buttons (native app) */
  #btn-bar.compact .btn { padding: 8px 4px; flex-direction: column; gap: 4px; }
  #btn-bar.compact .btn svg { width: 28px; height: 28px; }
  #btn-bar.compact .btn-label { font-size: 12px; text-align: center; }

  /* Landscape: controls pivot to a vertical strip on the right */
  body.landscape #viewfinder     { bottom: 0; right: var(--btn-bar-height); }
  body.landscape #controls       { top: 0; bottom: 0; left: auto; right: 0;
                                    width: var(--btn-bar-height); height: auto; }
  body.landscape #btn-bar        { height: 100%; flex-direction: column;
                                    border-top: none; border-left: 2px solid #fff; }
  body.landscape .btn            { border-left: none; border-top: 2px solid #fff;
                                    flex-direction: column; gap: 4px; padding: 8px 4px; }
  body.landscape .btn:first-child { border-top: none; }
  body.landscape .btn svg        { width: 28px; height: 28px; }
  body.landscape .btn-label      {
    font-size: 11px;
    text-align: center;

    /* offscreen */
    position: absolute;
    left: -9999px;
    top: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }

  /* Logo → bottom-left, zoom pill → top-left in landscape */
  body.landscape .heading    { top: auto; bottom: 0.7rem; }
  body.landscape #zoom-pill  { right: auto; left: 0.75rem; }

  /* ── OCR overlay ── */
  #ocr-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
  }
  #ocr-overlay.active { pointer-events: auto; }

  .ocr-block {
    position: absolute;
    border: 2px solid #000;
    outline: 2px solid #fff;
    background: transparent;
    box-sizing: border-box;
    cursor: pointer;
    border-radius: 3px;
    padding: .5em;
  }
  .ocr-block:active {
    border: 4px solid #000;
    outline: 4px solid #fff;
  }
</style>
</head>

    </h1>
    <button type="button" id="zoom-pill" onclick="cycleZoom()" aria-label="Change zoom level">
      <span id="zoom-label">1×</span>
    </button>

<!-- Viewfinder: video + tint overlay, both inside isolation context -->
<div id="viewfinder">
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="camera-canvas"></canvas>
  <div id="tint-overlay"></div>
  <div id="ocr-overlay"></div>
  <button id="no-camera" onclick="requestCamera()">Tap to Allow Camera</button>
</div>

<!-- Controls: 3 buttons with labels underneath -->
<div id="controls">
  <div id="btn-bar" role="toolbar" aria-label="Magnifier controls">

    <!-- Color mode cycle -->
    <button type="button" class="btn" onclick="nextMode()" aria-label="Change color mode">
      <svg id="mode-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle id="mode-circle" cx="12" cy="12" r="8.5" stroke-width="2.2"/>
      </svg>
      <span class="btn-label" id="mode-label">Color</span>
    </button>

    <!-- Brightness cycle -->
    <button type="button" class="btn" onclick="nextBright()" aria-label="Change brightness">
      <svg id="bright-svg" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle id="bright-circle" cx="12" cy="12" r="4" fill="none"/>
        <line x1="12"   y1="2"    x2="12"   y2="4.5"/>
        <line x1="12"   y1="19.5" x2="12"   y2="22"/>
        <line x1="2"    y1="12"   x2="4.5"  y2="12"/>
        <line x1="19.5" y1="12"   x2="22"   y2="12"/>
        <line x1="4.93" y1="4.93"  x2="6.7"   y2="6.7"/>
        <line x1="17.3" y1="17.3"  x2="19.07" y2="19.07"/>
        <line x1="4.93" y1="19.07" x2="6.7"   y2="17.3"/>
        <line x1="17.3" y1="6.7"   x2="19.07" y2="4.93"/>

    <!-- Light (flashlight) — native only, hidden in browser -->
    <button type="button" class="btn" id="torch-btn" onclick="toggleTorch()" aria-label="Toggle light" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="9" r="5.5"/>

<script>
(function () {
  'use strict';

  const MODES = [
    { name: 'Color',        short: 'Color',   naturalColor: true, tint: '#ffffff', iconFill: '#00ffff', iconStroke: '#00ffff' },
    { name: 'Yellow/Black', short: 'Y / Blk', invert: true,  tint: '#ffff00', iconFill: '#ffff00', iconStroke: '#ffff00' },
    { name: 'Black/Yellow', short: 'Blk / Y', invert: false, tint: '#ffff00', iconFill: '#000000', iconStroke: '#ffff00' },
    { name: 'Green/Black',  short: 'G / Blk', invert: true,  tint: '#00ff00', iconFill: '#00ff00', iconStroke: '#00ff00' },
    { name: 'Black/Green',  short: 'Blk / G', invert: false, tint: '#00ff00', iconFill: '#000000', iconStroke: '#00ff00' },
    { name: 'Purple/Black',  short: 'P / Blk', invert: true,  tint: '#9900ff', iconFill: '#9900ff', iconStroke: '#9900ff' },
    { name: 'Black/Purple',  short: 'Blk / P', invert: false, tint: '#9900ff', iconFill: '#000000', iconStroke: '#9900ff' },
  ];

  const BRIGHT = [
    { cont: 1.0 }, { cont: 2.0 }, { cont: 3.0 }, { cont: 4.0 },
  ];

  const STORAGE_KEY = 'mmagnifier';

  const video       = document.getElementById('camera');
  const canvas      = document.getElementById('camera-canvas');
  const ctx         = canvas.getContext('2d');
  const viewfinder  = document.getElementById('viewfinder');
  const noCamera    = document.getElementById('no-camera');
  const tintOverlay = document.getElementById('tint-overlay');
  const modeLabel   = document.getElementById('mode-label');
  const zoomLabel   = document.getElementById('zoom-label');
  const brightLabel = document.getElementById('bright-label');
  const modeCircle  = document.getElementById('mode-circle');

  const state = { modeIndex: 0, brightIndex: 0, zoom: 1 };
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (Number.isInteger(saved.modeIndex) && saved.modeIndex >= 0 && saved.modeIndex < MODES.length) state.modeIndex = saved.modeIndex;
    if (Number.isInteger(saved.brightIndex) && saved.brightIndex >= 0 && saved.brightIndex < BRIGHT.length) state.brightIndex = saved.brightIndex;
    if (typeof saved.zoom === 'number' && saved.zoom >= 1) state.zoom = saved.zoom;
  } catch (_) {}

  // Debounced save — coalesces rapid writes (e.g. pinch-zoom at 60fps)
  // so localStorage is written at most once per 300ms of inactivity.
  let saveTimer;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(writeState, 300);
  }

  function writeState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
  }

  // Write immediately instead of waiting out the debounce. Called when the app is on its
  // way out: settings changed in the last 300 ms would otherwise be lost if the OS kills
  // a backgrounded app, and losing your colour mode is a real annoyance when you rely on it.
  function flushSave() {
    clearTimeout(saveTimer);
    writeState();
  }

  let zoomLevels = [1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5, 5.5, 6]; // rebuilt from camera caps on start
  let maxZoom = 6;
  let zoomMode = null;   // null until camera starts, then 'canvas'
  let track = null;
  let zoomCaps = null;
  let supportsPOI = false;
  let trackCaps = {};       // getCapabilities() of the live track — gates which constraints we send
  let streamW = 0, streamH = 0;
  let focusRevertTimer = null;
  let frozen = false;
  let frozenImage  = null;  // canvas snapshot taken at freeze time (for rotation restore + future save)
  let frozenAtZoom = 1;     // state.zoom baked into the canvas when frozen; CSS scale = state.zoom / frozenAtZoom
  let frozenVideoFrame = null;    // full-res video frame captured at native-zoom=1 after freeze
  let frozenCaptureNativeZoom = 1;  // native zoom at frozenVideoFrame capture time
  let frozenDetailFrame = null;   // frame at the live native zoom, captured before the zoom-out
  let frozenDetailZoom  = 1;      // native zoom of frozenDetailFrame
  let ocrBlockZoom = 1;           // state.zoom at the time OCR blocks were rendered (for overlay tracking)
  let lastAppliedZoom = null;  // guards applyNativeZoom — skip if zoom didn't change

  let cameraStarted = false;
  let lastFrameAt   = 0;      // performance.now() of the last draw-loop tick; 0 = never ticked
  let recovering    = false;  // guards against overlapping camera re-acquisitions

  window.requestCamera = function () {
    // Self-guarding: set here rather than in the caller so every entry point
    // (initial start, the Tap-to-Allow button, recoverCamera) is covered. Stopping
    // the old track below can surface an 'ended' event on some WebViews, and this
    // stops that from re-entering recovery.
    recovering = true;
    // Stop any existing stream before requesting a new one.
    // Prevents orphaned tracks keeping the camera indicator lit.
    lastAppliedZoom = null;  // force quality constraints to reapply on new stream
    if (track) { try { track.stop(); } catch (_) {} track = null; }
    if (video.srcObject) {
      try { video.srcObject.getTracks().forEach(t => t.stop()); } catch (_) {}
      video.srcObject = null;
    }

    noCamera.style.display = 'none';
    const savedId = loadCameraId();
    (savedId ? openCamera(savedId).catch(() => null) : Promise.resolve(null))
    // No remembered camera, or it has gone away: let the browser choose, then check its choice.
    .then(stream => stream || openCamera(null).then(preferAutofocusCamera))
    .then(stream => {
      video.srcObject = stream;
      track = stream.getVideoTracks()[0];
      recovering  = false;
      lastFrameAt = performance.now();

      // The OS can revoke the camera at any time — another app claims it, or Android
      // reclaims it while we're backgrounded. 'ended' is the camera telling us directly.
      // Without this we sit on a dead track forever (Issue #22).
      track.addEventListener('ended', () => recoverCamera());

      const caps = (track.getCapabilities && track.getCapabilities()) || {};
      const settings = (track.getSettings && track.getSettings()) || {};
      streamW = settings.width  || 1920;
      streamH = settings.height || 1080;
      trackCaps = caps;
      // Chromium never lists pointsOfInterest as a capability (it is a setting), so testing for it
      // alone was always false on Android. single-shot is the focus mode a tap drives.
      supportsPOI = 'pointsOfInterest' in caps ||
        (Array.isArray(caps.focusMode) && caps.focusMode.includes('single-shot'));

      if (caps.zoom && typeof caps.zoom.max === 'number') {
        zoomCaps = caps.zoom;  // used as a quality supplement — see canvas draw loop
      }
      // Always canvas mode: canvas is the display layer, video stays hidden as data source.
      // Native zoom (when available) pre-zooms the stream up to its hardware cap;
      // the canvas crops any remaining factor. This gives the full stream-resolution
      // zoom range regardless of the native cap, with better quality at low zoom levels.
      zoomMode = 'canvas';
      // Use native zoom cap if the device reports one; otherwise fall back to 6×.
      // Canvas cropping handles anything above the native cap.
      maxZoom = (zoomCaps && typeof zoomCaps.max === 'number' && zoomCaps.max > 1)
        ? zoomCaps.max
        : 6;
      if (!cameraStarted) startCanvasLoop();
      cameraStarted = true;

      // 0.5× steps from 1–6, then 1× steps from 7 to maxZoom.
      zoomLevels = [];
      for (let z = 1; z <= Math.min(6, maxZoom) + 0.001; z += 0.5)
        zoomLevels.push(Math.round(z * 10) / 10);
      for (let z = 7; z <= maxZoom + 0.001; z += 1)
        zoomLevels.push(Math.round(z * 10) / 10);
      if (zoomLevels[zoomLevels.length - 1] < maxZoom - 0.05)
        zoomLevels.push(Math.round(maxZoom * 10) / 10);

      state.zoom = clamp(state.zoom, 1, maxZoom);
      render();
    })
    .catch(() => { recovering = false; noCamera.style.display = 'flex'; });
  };

  function openCamera(deviceId) {
    const want = {
      width:  { ideal: 3840 },
      height: { ideal: 2160 },
      focusMode: { ideal: 'continuous' },
    };
    if (deviceId) want.deviceId = { exact: deviceId };
    else          want.facingMode = { ideal: 'environment' };
    return navigator.mediaDevices.getUserMedia({ video: want, audio: false });
  }

  const CAMERA_KEY = 'mmagnifier-camera';
  function loadCameraId() {
    try { return localStorage.getItem(CAMERA_KEY); } catch (_) { return null; }
  }
  function saveCameraId(id) {
    if (!id) return;
    try { localStorage.setItem(CAMERA_KEY, id); } catch (_) {}
  }

  // `facingMode: 'environment'` does not mean "the main camera". On the Galaxy A15, Chromium
  // hands back a fixed-focus rear lens (focusMode: ['manual']) — close-up print can never be
  // sharp and tap-to-focus has nothing to drive. If the camera we got can't autofocus, try the
  // other rear cameras for one that can. The choice is remembered, so this runs once per install.
  async function preferAutofocusCamera(stream) {
    const t = stream.getVideoTracks()[0];
    const caps = (t.getCapabilities && t.getCapabilities()) || {};
    const currentId = t.getSettings().deviceId;
    // Browser doesn't report focus modes, or this camera already autofocuses: keep it.
    if (!Array.isArray(caps.focusMode) || caps.focusMode.includes('continuous')) {
      saveCameraId(currentId);
      return stream;
    }
    const others = (await navigator.mediaDevices.enumerateDevices())
      .filter(d => d.kind === 'videoinput' && d.deviceId && d.deviceId !== currentId);
    // Android opens one camera at a time — release this one before probing the rest.
    stream.getTracks().forEach(x => x.stop());
    for (const d of others) {
      const s = await openCamera(d.deviceId).catch(() => null);
      if (!s) continue;
      const st = s.getVideoTracks()[0];
      const c = (st.getCapabilities && st.getCapabilities()) || {};
      if (st.getSettings().facingMode === 'environment' &&
          Array.isArray(c.focusMode) && c.focusMode.includes('continuous')) {
        saveCameraId(d.deviceId);
        return s;
      }
      s.getTracks().forEach(x => x.stop());
    }
    // No rear camera autofocuses — go back to the browser's choice.
    saveCameraId(currentId);
    return openCamera(currentId);
  }

  window.requestCamera();

  function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }
  function fmtZoom(z) { return (Math.round(z * 10) / 10) + '×'; }

  // Returns a promise that resolves on the next rendered video frame.
  function waitForNextVideoFrame() {
    return new Promise(resolve => {
      if (typeof video.requestVideoFrameCallback === 'function') {
        video.requestVideoFrameCallback(() => resolve());
      } else {
        requestAnimationFrame(resolve);
      }
    });
  }

  // Draws frozenVideoFrame onto the canvas at targetZoom with pan offset from panX/panY globals.
  // Pan is applied as a source-crop offset (not CSS transform), so the canvas always fills
  // the viewport pixel-perfectly at any zoom/pan combination.
  // Also clamps panX/panY to valid bounds so the crop never reads outside the frame.
  function drawFrozenAtZoom(targetZoom) {
    if (!frozenVideoFrame) return;
    const bmp = frozenVideoFrame;
    const vw = bmp.width, vh = bmp.height;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    const cw = canvas.width, ch = canvas.height;
    const tA = cw / ch, sA = vw / vh;
    let sw, sh;
    if (sA > tA) { sh = vh; sw = sh * tA; }
    else         { sw = vw; sh = sw / tA; }
    const cropFactor = Math.max(1, targetZoom / frozenCaptureNativeZoom);
    sw /= cropFactor;
    sh /= cropFactor;
    // Convert screen-pixel pan (panX/panY) to source-pixel offset, clamping so the
    // crop never extends outside the frame.  canvas.offsetWidth is the CSS display width.
    const displayW = canvas.offsetWidth  || cw / (window.devicePixelRatio || 1);
    const displayH = canvas.offsetHeight || ch / (window.devicePixelRatio || 1);
    const maxPanX = Math.max(0, (vw - sw) / 2 * displayW / sw);
    const maxPanY = Math.max(0, (vh - sh) / 2 * displayH / sh);
    panX = clamp(panX, -maxPanX, maxPanX);
    panY = clamp(panY, -maxPanY, maxPanY);
    const sx = (vw - sw) / 2 - panX * sw / displayW;
    const sy = (vh - sh) / 2 - panY * sh / displayH;
    // The native-zoomed detail frame covers the centre 1/r of the wide frame. When the view
    // lies entirely inside it, draw from it — it is sharper than cropping the wide frame.
    const det = frozenDetailFrame;
    if (det && Math.abs(det.width / det.height - vw / vh) < 0.01) {
      const r  = frozenDetailZoom / frozenCaptureNativeZoom;
      const dw = vw / r, dh = vh / r, dx = (vw - dw) / 2, dy = (vh - dh) / 2;
      const eps = 0.5;
      if (sx >= dx - eps && sy >= dy - eps && sx + sw <= dx + dw + eps && sy + sh <= dy + dh + eps) {
        const k = r * det.width / vw;  // wide-frame px → detail-frame px
        ctx.drawImage(det, Math.max(0, (sx - dx) * k), Math.max(0, (sy - dy) * k),
                      Math.min(det.width, sw * k), Math.min(det.height, sh * k), 0, 0, cw, ch);
        return;
      }
    }
    ctx.drawImage(bmp, sx, sy, sw, sh, 0, 0, cw, ch);
  }

  // Applies the correct CSS transform to the OCR overlay in canvas-redraw mode so that
  // block outlines stay over their text at any zoom/pan level.
  // Scale is relative to ocrBlockZoom (the zoom at which blocks were placed).
  // Translate matches the panX/panY crop offset applied in drawFrozenAtZoom.
  function updateOCROverlayTransform() {
    const ocrOverlay = document.getElementById('ocr-overlay');
    if (ocrActive) {
      ocrOverlay.style.transform =
        `translate(${panX}px,${panY}px) scale(${state.zoom / ocrBlockZoom})`;
    } else {
      ocrOverlay.style.transform = '';
    }
  }

  // Applies the current scale + pan transform to the frozen canvas.
  // Clamps panX/panY so the canvas edge never goes past the viewfinder edge (no black bars).
  // Called from pinch, cycleZoom, drag, and resize — keeps all transforms consistent.
  function applyCanvasTransform() {
    const S     = state.zoom / frozenAtZoom;
    const maxPX = Math.max(0, viewfinder.clientWidth  * (S - 1) / 2);
    const maxPY = Math.max(0, viewfinder.clientHeight * (S - 1) / 2);
    panX = clamp(panX, -maxPX, maxPX);
    panY = clamp(panY, -maxPY, maxPY);
    const xform = `translate(${panX}px,${panY}px) scale(${S})`;
    canvas.style.transform = xform;
    document.getElementById('ocr-overlay').style.transform = xform;
  }

  function startCanvasLoop() {
    viewfinder.classList.add('canvas-tier');
    const dpr = window.devicePixelRatio || 1;
    function resize() {
      const w = viewfinder.clientWidth  || window.innerWidth;
      const h = viewfinder.clientHeight || (window.innerHeight - 72);
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      if (ocrActive) clearOCR();  // overlay coords stale after rotation
      // canvas.width/height clears the canvas to black. If paused, restore the frozen view.
      if (frozen) {
        if (frozenVideoFrame) {
          // Full-res frame available: redraw at current zoom (handles any rotation / aspect change).
          // ocrActive is always false here — clearOCR() ran above.
          drawFrozenAtZoom(state.zoom);
        } else if (frozenImage) {
          // Fall back to the initial canvas snapshot + CSS transform.
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(frozenImage, 0, 0, canvas.width, canvas.height);
          applyCanvasTransform();
        }
        // else: no snapshot ready yet (brief async gap after freeze) — canvas stays black momentarily
      }
    }
    resize();
    // ResizeObserver fires reliably on viewport rotation in Capacitor WebViews;
    // window 'resize' is the fallback for browsers that lack it.
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(resize).observe(viewfinder);
    } else {
      window.addEventListener('resize', resize);
    }

    function draw() {
      // Tick even while frozen. The stream is still live when paused, so a stalled
      // tick means the camera died — not that the user pressed Pause.
      lastFrameAt = performance.now();
      if (!frozen) drawCurrentFrame();
      schedule();
    }
    function schedule() {
      if (typeof video.requestVideoFrameCallback === 'function') {
        video.requestVideoFrameCallback(draw);
      } else {
        requestAnimationFrame(draw);
      }
    }
    schedule();
  }

  // Draws one live frame from the camera stream at the current zoom/crop settings.
  // Only called by the draw loop (live mode). While frozen, the canvas is a static
  // pixel buffer — zoom is applied via CSS transform on the element, not by redrawing.
  function drawCurrentFrame() {
    if (frozen) return;
    const vw = video.videoWidth, vh = video.videoHeight;
    if (video.readyState < 2 || !vw || !vh) return;
    const nativeZ = zoomCaps ? clamp(state.zoom, zoomCaps.min, zoomCaps.max) : 1;
    // Live feed always uses bilinear ('low') — motion makes quality difference invisible,
    // and Lanczos at 30fps is 3–5× more expensive on mobile hardware.
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'low';
    const cw = canvas.width, ch = canvas.height;
    const tA = cw / ch, sA = vw / vh;
    let sw, sh;
    if (sA > tA) { sh = vh; sw = sh * tA; }
    else         { sw = vw; sh = sw / tA; }
    // Native zoom pre-zooms up to its hardware cap; canvas crops the rest.
    sw /= (state.zoom / nativeZ);
    sh /= (state.zoom / nativeZ);
    const sx = (vw - sw) / 2;
    const sy = (vh - sh) / 2;
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
    window._lastDrawnTimestamp = Date.now();
  }

  function applyNativeZoom() {
    if (!track || !zoomCaps) return;
    const z = clamp(state.zoom, zoomCaps.min, zoomCaps.max);
    // Guard: skip if zoom value hasn't changed. applyConstraints is called by render(),
    // which fires on every button press — skipping no-op calls keeps UI response instant.
    if (z === lastAppliedZoom) return;
    lastAppliedZoom = z;
    track.applyConstraints(zoomConstraints(z)).catch(() => {});
  }

  // Constraints for a native zoom level, limited to what this track supports. Chromium rejects
  // the whole advanced set if any key is unsupported: bundling `sharpness` (which Android cameras
  // don't expose) made every zoom call fail with OverconstrainedError, so native zoom never ran.
  function zoomConstraints(z) {
    const set = { zoom: z };
    if (trackCaps.sharpness) set.sharpness = clamp(8, trackCaps.sharpness.min, trackCaps.sharpness.max);
    return { advanced: [set] };
  }

  function render() {
    const m = MODES[state.modeIndex];
    const b = BRIGHT[state.brightIndex];

    let base;
    if (m.naturalColor) base = '';
    else base = m.invert ? 'invert(1) grayscale(1) brightness(1.1)' : 'grayscale(1) brightness(0.8)';
    const filterValue = base ? `${base} contrast(${b.cont})` : `contrast(${b.cont})`;

    if (zoomMode === 'canvas') {
      canvas.style.filter = filterValue;
      video.style.filter = '';
      if (zoomCaps && !frozen) applyNativeZoom();  // pre-zoom the stream for quality
    }
    // else: camera not yet started — nothing to filter yet

    tintOverlay.style.background = m.tint;

    modeLabel.textContent   = m.short;
    zoomLabel.textContent   = fmtZoom(state.zoom);
    brightLabel.textContent = b.cont + '×';

    modeCircle.setAttribute('fill',   m.iconFill);
    modeCircle.setAttribute('stroke', m.iconStroke);

    save();
    // While frozen, CSS filter on the canvas element handles mode/brightness changes
    // without any redraw. Zoom is handled by CSS transform in the pinch/cycleZoom paths.
  }

  window.nextMode   = () => { state.modeIndex   = (state.modeIndex   + 1) % MODES.length;  render(); };
  window.nextBright = () => { state.brightIndex = (state.brightIndex + 1) % BRIGHT.length; render(); };
  window.cycleZoom  = () => {
    const next = zoomLevels.find(v => v > state.zoom + 0.001);
    state.zoom = (next != null) ? next : zoomLevels[0];
    if (frozen) {
      if (frozenVideoFrame) {
        // Full-res frame ready: pixel-accurate redraw — same path for Pause and Read.
        drawFrozenAtZoom(state.zoom);  // also clamps/updates panX,panY
        frozenAtZoom = state.zoom;
        canvas.style.transform = '';
        updateOCROverlayTransform();   // scale overlay so blocks stay over their text
      } else {
        // Full-res capture still in progress: CSS-transform interim.
        applyCanvasTransform();
      }
      zoomLabel.textContent = fmtZoom(state.zoom);
      save();
    } else {
      render();
    }
  };

  // ── Pinch-to-zoom + drag-to-pan + tap-to-focus ───────────────
  let pinching = false;
  let pinchStartDist = 0;
  let pinchStartZoom = 1;
  let tapStart = null;
  let dragging   = false;      // true during a 1-finger drag while frozen
  let dragStartX = 0, dragStartY = 0;  // client coords at drag start
  let panX = 0,  panY = 0;             // current pan offset in screen px
  let panStartX  = 0, panStartY  = 0; // panX/panY snapshot at drag start

  function dist(a, b) {
    return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  }

  viewfinder.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      pinching = true;
      pinchStartDist = dist(e.touches[0], e.touches[1]);
      pinchStartZoom = state.zoom;
      tapStart = null;
      e.preventDefault();
    } else if (e.touches.length === 1 && !pinching) {
      const t = e.touches[0];
      tapStart = { x: t.clientX, y: t.clientY, time: Date.now() };
      if (frozen) {
        dragging   = true;
        dragStartX = t.clientX;
        dragStartY = t.clientY;
        panStartX  = panX;
        panStartY  = panY;
      }
    }
  }, { passive: false });

  viewfinder.addEventListener('touchmove', (e) => {
    if (pinching && e.touches.length === 2) {
      const d = dist(e.touches[0], e.touches[1]);
      if (!pinchStartDist) return;  // guard: avoid NaN if fingers started at same pixel
      const ratio = d / pinchStartDist;
      state.zoom = clamp(pinchStartZoom * ratio, 1, maxZoom);
      if (frozen) {
        if (frozenVideoFrame) {
          // Full-res frame ready: pixel-accurate redraw — same path for Pause and Read.
          drawFrozenAtZoom(state.zoom);  // also clamps/updates panX,panY
          frozenAtZoom = state.zoom;
          canvas.style.transform = '';
          updateOCROverlayTransform();   // scale overlay so blocks stay over their text
        } else {
          // Full-res capture in progress: CSS-transform interim.
          applyCanvasTransform();
        }
        zoomLabel.textContent = fmtZoom(state.zoom);
        save();
      } else {
        render();
      }
      e.preventDefault();
    } else if (dragging && e.touches.length === 1 && frozen) {
      // 1-finger drag: pan the frozen canvas
      const t = e.touches[0];
      panX = panStartX + (t.clientX - dragStartX);
      panY = panStartY + (t.clientY - dragStartY);
      if (frozenVideoFrame) {
        // Canvas-redraw mode: pan via crop offset inside drawFrozenAtZoom.
        drawFrozenAtZoom(state.zoom);  // clamps panX,panY as a side-effect
        canvas.style.transform = '';
        updateOCROverlayTransform();
      } else {
        applyCanvasTransform();  // CSS-transform interim: pan via CSS translate
      }
      e.preventDefault();
    }
  }, { passive: false });

  viewfinder.addEventListener('touchend', (e) => {
    if (e.touches.length < 2 && pinching) {
      pinching = false;
      tapStart = null;
      return;
    }
    if (dragging && e.touches.length === 0) {
      dragging = false;
      // panX/panY intentionally preserved — position holds until unfreeze
    }
    if (e.touches.length === 0 && tapStart && supportsPOI && track && !frozen) {
      const t = e.changedTouches[0];
      const dt = Date.now() - tapStart.time;
      const dx = Math.abs(t.clientX - tapStart.x);
      const dy = Math.abs(t.clientY - tapStart.y);
      if (dt < 500 && dx < 10 && dy < 10) {
        const rect = viewfinder.getBoundingClientRect();
        const x = clamp((t.clientX - rect.left) / rect.width,  0, 1);
        const y = clamp((t.clientY - rect.top)  / rect.height, 0, 1);
        track.applyConstraints({
          advanced: [{ pointsOfInterest: [{ x, y }], focusMode: 'single-shot' }],
        }).catch(() => {});
        if (focusRevertTimer) clearTimeout(focusRevertTimer);
        focusRevertTimer = setTimeout(() => {
          track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
        }, 2000);
      }
    }
    tapStart = null;
  });

  render();

  // ── Native-only features (torch + freeze) ────────────────────
  const isNative = typeof window.Capacitor !== 'undefined' && window.Capacitor.isNativePlatform();

  if (isNative) {
    document.getElementById('torch-btn').style.display  = 'flex';
    document.getElementById('read-btn').style.display   = 'flex';
    document.getElementById('freeze-btn').style.display = 'flex';
    document.getElementById('btn-bar').classList.add('compact');
  }

  let torchOn = false;
  window.toggleTorch = async () => {
    if (!isNative) return;
    const nextState = !torchOn;
    let success = false;

    // Primary: use the live camera track's torch constraint.
    // This works while the camera is open (no CameraAccessException conflict).
    if (track) {
      try {
        await track.applyConstraints({ advanced: [{ torch: nextState }] });
        success = true;
      } catch (_) {}
    }

    // Fallback: Capacitor plugin (e.g. torch-only devices or when track unavailable)
    if (!success) {
      try {
        const Torch = window.Capacitor?.Plugins?.Torch;
        if (Torch) {
          nextState ? await Torch.enable() : await Torch.disable();
          success = true;
        }
      } catch (_) {}
    }

    if (success) {
      torchOn = nextState;
      document.getElementById('torch-label').textContent = torchOn ? 'Light On' : 'Light';
      document.getElementById('torch-btn').style.background = torchOn ? '#222' : '';
    }
  };

  // ── App lifecycle + camera recovery ──────────────────────────
  // Issue #22. Backgrounding the app lets the OS reclaim the camera. The
  // MediaStreamTrack is left dead — no further frames are delivered — so the draw
  // loop (driven by requestVideoFrameCallback) stops ticking and the app is stuck
  // on its last frame until it's force-quit. This block previously ran on web only,
  // on the assumption that the OS handled the native case. It does not.
  //
  // Three layers, because a low-vision user cannot diagnose a frozen screen:
  //   1. visibilitychange — release on hide, re-acquire on show
  //   2. track 'ended'    — the OS telling us directly that the camera is gone
  //   3. a stall watchdog — last resort for a silent stall the other two miss
  //
  // A frozen frame survives all three. The canvas keeps its pixels and
  // drawCurrentFrame() is a no-op while frozen, so re-acquiring the stream is
  // invisible: someone who was mid-read comes back to the same text, and Resume
  // then works normally instead of dead-ending.
  const STALL_MS = 2500;  // ~75 missed frames at 30fps — unambiguously a stall

  function releaseCamera() {
    if (track) { try { track.stop(); } catch (_) {} track = null; }
    if (video.srcObject) {
      try { video.srcObject.getTracks().forEach(t => t.stop()); } catch (_) {}
      video.srcObject = null;
    }
  }

  function recoverCamera() {
    if (recovering || document.hidden) return;
    recovering = true;
    window.requestCamera();  // clears `recovering` once the stream settles or fails
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      flushSave();      // the OS may kill us while backgrounded — commit settings now
      releaseCamera();
    } else {
      lastFrameAt = performance.now();  // grace period before the watchdog judges
      recoverCamera();
    }
  });

  window.addEventListener('pagehide', flushSave);

  // Watchdog: if the loop has gone quiet while we are visible, the stream is dead.
  setInterval(() => {
    if (document.hidden || recovering || !cameraStarted) return;
    if (lastFrameAt && performance.now() - lastFrameAt > STALL_MS) recoverCamera();
  }, 1000);

  // ── Landscape layout ─────────────────────────────────────────
  // When viewport is wider than tall, toggle the 'landscape' class on body.
  // CSS handles button rotation and sizing from there.
  function updateOrientation() {
    document.body.classList.toggle('landscape', window.innerWidth > window.innerHeight);
  }
  window.addEventListener('resize', updateOrientation);
  updateOrientation();

  // ── OCR + Text-to-Speech ─────────────────────────────────────
  let ocrActive     = false;
  let ocrGeneration = 0;      // incremented on each runOCR call; guards stale async callbacks

  window.runOCR = async () => {
    if (!isNative) return;
    if (ocrActive) {
      // Second press: stop OCR and unfreeze — same as pressing Pause
      clearOCR();
      if (frozen) freezeFrame();
      return;
    }

    if (!frozen) freezeFrame();

    ocrActive = true;
    const gen = ++ocrGeneration;  // capture this call's generation ID

    const readLabel = document.getElementById('read-label');
    const readBtn   = document.getElementById('read-btn');
    readLabel.textContent    = 'Stop';
    readBtn.style.background = '#222';

    const base64 = canvas.toDataURL('image/jpeg', 0.9).split(',')[1];

    try {
      const Plugin = window.Capacitor?.Plugins?.CapacitorPluginMlKitTextRecognition;
      const result = await Plugin.detectText({ base64Image: base64 });

      // If OCR was cancelled while we were awaiting, discard this result silently
      if (!ocrActive || gen !== ocrGeneration) return;

      const blocks = result.blocks || [];

      if (blocks.length === 0) {
        readLabel.textContent = 'No text';
        setTimeout(() => { if (ocrActive && gen === ocrGeneration) clearOCR(); }, 2000);
        return;
      }

      // Sort top-to-bottom, then left-to-right
      blocks.sort((a, b) =>
        a.boundingBox.top !== b.boundingBox.top
          ? a.boundingBox.top - b.boundingBox.top
          : a.boundingBox.left - b.boundingBox.left
      );

      renderOCRBlocks(blocks);
      speakText(blocks.map(b => b.text).join('. '));

    } catch (_) {
      if (!ocrActive || gen !== ocrGeneration) return;
      readLabel.textContent = 'Error';
      setTimeout(() => { if (ocrActive && gen === ocrGeneration) clearOCR(); }, 2000);
    }
  };

  function renderOCRBlocks(blocks) {
    ocrBlockZoom = state.zoom;  // record zoom so updateOCROverlayTransform can track changes
    const overlay = document.getElementById('ocr-overlay');
    overlay.innerHTML = '';
    overlay.style.transform = '';  // start from a clean transform; updateOCROverlayTransform sets it
    overlay.classList.add('active');

    // boundingBox is in image pixels (canvas.width × canvas.height).
    // Scale to CSS display pixels (canvas.clientWidth × canvas.clientHeight).
    const sx = canvas.clientWidth  / canvas.width;
    const sy = canvas.clientHeight / canvas.height;

    blocks.forEach(block => {
      const el = document.createElement('button');
      el.className    = 'ocr-block';
      el.style.left   = (block.boundingBox.left                              * sx) + 'px';
      el.style.top    = (block.boundingBox.top                               * sy) + 'px';
      el.style.width  = ((block.boundingBox.right  - block.boundingBox.left) * sx) + 'px';
      el.style.height = ((block.boundingBox.bottom - block.boundingBox.top)  * sy) + 'px';
      el.addEventListener('click', () => speakText(block.text));
      el.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); speakText(block.text); }
      });
      overlay.appendChild(el);
    });
  }

  function speakText(text) {
    // Prefer Capacitor native TTS (reliable on Android + iOS).
    // window.speechSynthesis is undefined in Capacitor's Android WebView.
    const TTS = window.Capacitor?.Plugins?.TextToSpeech;
    if (TTS) {
      TTS.speak({ text, lang: 'en-US' }).catch(() => {});
      return;
    }
    // Web fallback (browser / future environments)
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
  }

  function clearOCR() {
    // Stop any active speech — guard against undefined in either path
    const TTS = window.Capacitor?.Plugins?.TextToSpeech;
    if (TTS) { TTS.stop().catch(() => {}); }
    else { try { window.speechSynthesis?.cancel(); } catch (_) {} }
    ocrActive = false;
    ocrBlockZoom = 1;
    const overlay = document.getElementById('ocr-overlay');
    overlay.innerHTML = '';
    overlay.style.transform = '';
    overlay.classList.remove('active');
    document.getElementById('read-label').textContent    = 'Read';
    document.getElementById('read-btn').style.background = '';
    // Does not touch frozen state — freeze/unfreeze is managed entirely by freezeFrame()
  }

  // ── Freeze frame ─────────────────────────────────────────────
  // Freeze frame: stop the canvas draw loop so users can inspect steady content.
  // The video stream keeps running; `frozen` stops drawImage() each frame.
  //
  // Zoom while frozen:
  //   • The draw loop is stopped immediately on freeze.  While frozenVideoFrame is being
  //     captured (≈250 ms), zoom uses a CSS transform on the existing canvas.
  //   • Once frozenVideoFrame arrives (native-zoomed-out, full-res), zoom redraws the
  //     canvas from that bitmap — the full scene is recoverable at any zoom level.
  //   • OCR-active path stays on CSS transform so outline boxes remain aligned.
  window.freezeFrame = () => {
    frozen = !frozen;
    if (frozen) {
      frozenAtZoom = state.zoom;  // zoom baked into current canvas, used for CSS transform interim
      panX = panY = 0;
      frozenVideoFrame = null;
      frozenCaptureNativeZoom = 1;
      frozenDetailFrame = null;

      // Immediate canvas snapshot — backs up the current view for rotation-restore and
      // the CSS-transform interim before frozenVideoFrame is ready.
      createImageBitmap(canvas)
        .then(bmp => { if (frozen) frozenImage = bmp; })
        .catch(() => {});

      // Async: reset native zoom to minimum, wait for the camera to settle, then capture
      // a full-resolution video frame.  Once ready, replace the CSS-transform zoom path
      // with pixel-accurate canvas redraws — enabling full zoom-in/out on the frozen image.
      (async () => {
        const captureNativeZ = zoomCaps ? (zoomCaps.min || 1) : 1;
        // Keep the frame on screen first: at native zoom it holds more real detail than any
        // crop of the zoomed-out frame below. drawFrozenAtZoom uses it whenever the view fits.
        const liveNativeZ = zoomCaps ? clamp(state.zoom, zoomCaps.min, zoomCaps.max) : 1;
        if (track && liveNativeZ > captureNativeZ) {
          const detail = await createImageBitmap(video).catch(() => null);
          if (!frozen) return;
          frozenDetailFrame = detail;
          frozenDetailZoom  = liveNativeZ;
        }
        if (track && zoomCaps) {
          await track.applyConstraints(zoomConstraints(captureNativeZ)).catch(() => {});
          // Wait for the camera HAL to deliver a frame at the new zoom (typically ≤200 ms).
          await new Promise(resolve => setTimeout(resolve, 250));
          await waitForNextVideoFrame();
        }
        if (!frozen) return;  // user resumed while we were waiting
        const bmp = await createImageBitmap(video).catch(() => null);
        if (!frozen || !bmp) return;
        frozenVideoFrame = bmp;
        frozenCaptureNativeZoom = captureNativeZ;
        // Seamlessly replace the CSS-transform interim view with pixel-accurate canvas pixels.
        // Works for both Pause and Read modes; OCR block outlines are preserved via overlay transform.
        panX = panY = 0;
        canvas.style.transform = '';
        drawFrozenAtZoom(state.zoom);
        frozenAtZoom = state.zoom;
        updateOCROverlayTransform();  // keeps block outlines aligned; no-op if !ocrActive
        // Refresh frozenImage so rotation-restore uses the updated content.
        createImageBitmap(canvas)
          .then(bmp2 => { if (frozen) frozenImage = bmp2; })
          .catch(() => {});
      })();

      document.getElementById('freeze-label').textContent = 'Resume';
      document.getElementById('freeze-icon').innerHTML =
        '<polygon points="6,4 6,20 20,12" />';
      document.getElementById('freeze-btn').style.background = '#222';
    } else {
      if (ocrActive) clearOCR();  // tidy up OCR overlay if Pause pressed while Read active
      panX = panY = 0;
      dragging = false;
      canvas.style.transform = '';
      document.getElementById('ocr-overlay').style.transform = '';
      frozenImage  = null;
      frozenVideoFrame = null;
      frozenCaptureNativeZoom = 1;
      frozenDetailFrame = null;
      frozenAtZoom = 1;
      lastAppliedZoom = null;  // force applyNativeZoom to re-sync camera to current zoom
      applyNativeZoom();
      document.getElementById('freeze-label').textContent = 'Pause';
      document.getElementById('freeze-icon').innerHTML =
        '<rect x="6" y="4" width="4" height="16" rx="0.5"/><rect x="14" y="4" width="4" height="16" rx="0.5"/>';
      document.getElementById('freeze-btn').style.background = '';
    }
  };

}());
</script>
</body>
</html>
